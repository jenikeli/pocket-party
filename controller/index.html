<!-- Controller page (/): what each player opens on their phone. Join screen, then the lobby, then the input lab. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- maximum-scale and user-scalable stop pinch zoom on Android; iOS also needs touch-action in the CSS. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pocket Party</title>
  <link rel="stylesheet" href="/controller/style.css">
</head>
<body>
  <main id="join-screen">
    <h1>Pocket Party</h1>
    <form id="join-form">
      <label for="player-name">Your name</label>
      <input id="player-name" maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
      <label for="room-code">Room code</label>
      <input id="room-code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button id="join-button" type="submit">Join</button>
    </form>
    <p id="join-status"></p>
    <dl id="device-info"></dl>
  </main>

  <!-- The lobby: who this phone plays as, and the ready button. -->
  <main id="lobby-screen" hidden>
    <p id="lobby-room"></p>
    <p id="player-badge"><span id="player-swatch"></span><span id="player-label"></span></p>
    <button type="button" id="ready-button" aria-pressed="false">I'm ready</button>
    <p id="lobby-hint"></p>
    <p id="wake-status"></p>
    <button type="button" class="leave-button">Leave game</button>
  </main>

  <!-- The input lab: pick an input with the tabs, try it on the pad, and read what is being sent below. -->
  <main id="pad-screen" hidden>
    <div id="pad-top">
      <p id="pad-status"></p>
      <button type="button" class="leave-button">Leave</button>
    </div>
    <nav id="mode-tabs">
      <button type="button" data-mode="drag">Drag</button>
      <button type="button" data-mode="tap">Tap</button>
      <button type="button" data-mode="swipe">Swipe</button>
      <button type="button" data-mode="tilt">Tilt</button>
    </nav>
    <p id="lab-notice" hidden></p>
    <div id="input-pad">
      <div id="stick-ring"><div id="stick-knob"></div></div>
      <p id="big-readout"></p>
      <button type="button" id="enable-tilt-button">Enable tilt</button>
      <button type="button" id="calibrate-button">Set zero</button>
      <p id="pad-hint"></p>
    </div>
    <dl id="readout">
      <dt>Sending</dt><dd id="readout-value">-</dd>
      <dt>Rate</dt><dd id="readout-rate">0 Hz</dd>
      <dt>Tilt sensor</dt><dd id="readout-tilt">not enabled</dd>
    </dl>
  </main>
  <!-- Covers every screen while the phone gets its slot back after a drop. -->
  <div id="reconnect-overlay" hidden>
    <p id="reconnect-text"></p>
    <button type="button" id="reconnect-button" hidden>Tap to reconnect</button>
    <button type="button" class="leave-button" id="overlay-leave-button" hidden>Leave game</button>
  </div>
  <script type="module" src="/controller/main.js"></script>
</body>
</html>
