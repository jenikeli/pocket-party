<!-- Host display page (/host): runs the authoritative game. The shell's screens (Tap to start, the game picker,
     the top bar with its settings, the join window, loading) are the HTML below, run by host/main.js; a running
     game draws in its own container, created by host/game-session.js. -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- maximum-scale and user-scalable stop pinch zoom on Android; iOS ignores them (host/main.js handles it). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pocket Party - Host</title>
  <link rel="stylesheet" href="/host/ui.css">
  <link rel="stylesheet" href="/host/shell.css">
  <link rel="stylesheet" href="/host/game-picker.css">
  <link rel="stylesheet" href="/host/top-bar.css">
</head>

<body>
  <section id="tap-to-start" class="shell-screen">
    <div class="pp-stage tap-stage">
      <h1 class="pp-title tap-title">Pocket Party</h1>
      <button type="button" id="tap-to-start-button" class="pp-button pp-primary pp-big">Tap to start</button>
      <p class="pp-muted">Turns the sound on and goes full screen</p>
    </div>
  </section>

  <section id="game-picker" class="shell-screen" hidden>
    <div class="picker-picture">
      <img id="picker-background" alt="" hidden>
      <div class="pp-scrim"></div>
    </div>
    <div class="pp-stage picker-stage">
      <div class="picker-game on-picture">
        <h1 id="picker-game-title" class="pp-title picker-game-title"></h1>
        <p id="picker-game-blurb" class="picker-blurb"></p>
        <p class="picker-range"><span class="icon-slot" data-icon="user"></span><span id="picker-player-range"></span></p>
        <button type="button" id="play-button" class="pp-button pp-primary pp-big"><span class="icon-slot"
            data-icon="play"></span>Play</button>
        <p id="picker-problem" class="picker-problem"></p>
      </div>
      <div id="picker-games" class="picker-games"></div>
    </div>
  </section>

  <!-- Over the picker and every game (host/game-bar.js). Games keep the top corners clear for it, or dock it as a
       strip along the bottom (bar.setDocked) and put their own controls in #bar-slot. -->
  <div id="top-bar" class="pp-stage top-bar" hidden>
    <div class="top-bar-left">
      <button type="button" id="game-back-button" class="pp-button top-bar-button" hidden><span class="icon-slot"
          data-icon="back"></span>Back to games</button>
      <div id="bar-slot" class="bar-slot"></div>
    </div>
    <div class="top-bar-right">
      <span id="room-code-chip" class="room-code-chip" hidden></span>
      <button type="button" id="game-add-players-button" class="pp-button pp-primary top-bar-button" hidden><span
          class="icon-slot" data-icon="add-players"></span>Add players</button>
      <button type="button" id="settings-button" class="pp-icon-button" data-icon="gear" aria-label="Settings"
        title="Settings" aria-pressed="false"></button>
    </div>
    <div id="settings" class="pp-panel settings" hidden>
      <div class="settings-row">
        <span class="settings-label">Music</span>
        <input type="range" id="music-volume" min="0" max="100" step="5" aria-label="Music volume"
          title="Music volume">
      </div>
      <div class="settings-row">
        <span class="settings-label">Sound effects</span>
        <input type="range" id="effects-volume" min="0" max="100" step="5" aria-label="Effects volume"
          title="Effects volume">
      </div>
      <div class="settings-row">
        <span class="settings-label">Hold a dropped player</span>
        <button type="button" id="grace-minus" class="pp-icon-button" data-icon="minus"
          aria-label="Hold a dropped player for less time" title="Hold a dropped player for less time"></button>
        <span id="grace-value" class="settings-value"></span>
        <button type="button" id="grace-plus" class="pp-icon-button" data-icon="plus"
          aria-label="Hold a dropped player for more time" title="Hold a dropped player for more time"></button>
      </div>
    </div>
  </div>

  <section id="join-window" class="shell-overlay join-window" hidden>
    <div class="pp-stage">
      <div class="pp-panel join-panel">
        <div id="join-qr" class="join-qr"></div>
        <div class="join-text">
          <h2 class="pp-title join-title">Join the party</h2>
          <p class="pp-muted join-hint">Scan the code, or open the link and type the room code</p>
          <p id="join-code" class="pp-title join-code"></p>
          <p id="join-url" class="join-url"></p>
          <p id="join-lan-warning" class="join-warning" hidden>Phones cannot reach "localhost". Open /host using
            the LAN IP instead.</p>
          <div id="join-players" class="player-chips"></div>
          <button type="button" id="join-done-button" class="pp-button pp-primary pp-big join-done">Done</button>
        </div>
      </div>
    </div>
  </section>

  <section id="loading-screen" class="shell-overlay loading-screen" hidden>
    <img id="loading-picture" alt="" hidden>
    <div class="loading-scrim"></div>
    <div class="pp-stage loading-stage on-picture">
      <h1 id="loading-title" class="pp-title loading-title"></h1>
      <div class="loading-track"><div id="loading-bar" class="loading-bar"></div></div>
      <p id="loading-label"></p>
    </div>
  </section>

  <p id="wake-status"></p>
  <!-- Three.js (used by the 3D games) and its add-ons import the bare name "three"; the import map tells the
       browser which file that is. It must come before any module script. -->
  <script type="importmap">
    {
      "imports": {
        "three": "/host/vendor/three-0.186.1/three.module.js",
        "three/addons/": "/host/vendor/three-0.186.1/addons/"
      }
    }
  </script>
  <script type="module" src="/host/main.js"></script>
</body>

</html>
