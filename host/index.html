<!-- Host display page (/host): runs the authoritative game. The shell (lobby) draws with Phaser in #shell;
     a running game draws in its own container, created by host/game-session.js. -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Party - Host</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #10131c;
      overflow: hidden;
    }

    /* Our display rules below would otherwise beat the browser's default for the hidden attribute. */
    [hidden] {
      display: none !important;
    }

    #shell,
    #game-container {
      width: 100vw;
      height: 100dvh;
    }

    /* A small line over the canvas (an HTML element, so every scene shows it without drawing it). */
    #wake-status {
      position: fixed;
      left: 8px;
      bottom: 4px;
      margin: 0;
      font: 12px sans-serif;
      color: #5c6680;
      pointer-events: none;
    }

    /* The shell's buttons over a running game, bottom right, where games keep clear. */
    #game-bar {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 12px;
    }

    #game-bar button {
      font: 22px sans-serif;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2a3145;
      color: #ffffff;
      cursor: pointer;
    }

    #game-bar button.armed {
      background: #8e2b22;
    }
  </style>
</head>

<body>
  <div id="shell"></div>
  <div id="game-bar" hidden>
    <button type="button" id="end-game-button">End game</button>
    <button type="button" id="close-room-button">Close room</button>
  </div>
  <p id="wake-status"></p>
  <script type="module" src="/host/main.js"></script>
</body>

</html>
