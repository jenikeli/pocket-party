<!-- Host display page (/host): runs the authoritative game and renders it with Phaser. -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Party - Host</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #10131c;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100dvh;
    }

    /* A small line over the canvas (an HTML element, so every scene shows it without drawing it). */
    #wake-status {
      position: fixed;
      left: 8px;
      bottom: 4px;
      margin: 0;
      font: 12px sans-serif;
      color: #5c6680;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <p id="wake-status"></p>
  <script type="module" src="/host/main.js"></script>
</body>

</html>
